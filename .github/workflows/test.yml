name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch has the same Qt as the people who install CargoHatch; Ubuntu's is too old.
    container: archlinux:latest
    steps:
      - name: Install the build tools, Qt, poppler and a font
        run: |
          pacman -Syu --noconfirm --needed base-devel git qt6-base qt6-wayland qt6-multimedia qt6-multimedia-ffmpeg poppler ttf-dejavu
          # Root can write read-only files, which the delete tests rely on not happening.
          useradd -m tester
      - uses: actions/checkout@v4
      - name: Build and test as an ordinary user
        run: |
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c 'bin/build && bin/test'
